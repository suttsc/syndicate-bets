<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <title>Bets · Live scores</title>
    <meta name="description" content="How this week's football bets are getting on." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/js/scores.js"></script>
  </head>
  <body>
    <div class="mx-auto flex min-h-dvh max-w-3xl flex-col px-4 pt-[max(1rem,env(safe-area-inset-top))] pb-[max(1.5rem,env(safe-area-inset-bottom))]">
      <header class="flex items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight">This week's bets</h1>
          <p id="subtitle" class="text-sm text-slate-500 dark:text-slate-400">Loading…</p>
        </div>
        <button
          id="refresh"
          type="button"
          aria-label="Refresh scores"
          class="grid size-11 place-items-center rounded-full bg-white text-slate-700 shadow-sm ring-1 ring-slate-200 transition active:scale-95 dark:bg-slate-900 dark:text-slate-200 dark:ring-slate-800"
        >
          <svg id="refresh-icon" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" />
          </svg>
        </button>
      </header>

      <!-- Summary: sticky so the tally stays in view while scrolling cards -->
      <section id="summary" aria-live="polite" class="sticky top-0 z-10 -mx-4 mt-4 bg-slate-100/85 px-4 py-3 backdrop-blur dark:bg-slate-950/85">
        <div class="h-[118px] animate-pulse rounded-2xl bg-slate-200 dark:bg-slate-900"></div>
      </section>

      <main id="games" class="mt-2 grid gap-3 md:grid-cols-2">
        <div class="h-40 animate-pulse rounded-2xl bg-slate-200 dark:bg-slate-900"></div>
        <div class="h-40 animate-pulse rounded-2xl bg-slate-200 dark:bg-slate-900"></div>
      </main>

      <footer class="mt-auto pt-8 text-center text-xs text-slate-500 dark:text-slate-500">
        <p id="updated">&nbsp;</p>
        <p class="mt-1">Scores via ESPN · <a href="/admin" class="underline decoration-dotted underline-offset-2">Admin</a></p>
      </footer>
    </div>
  </body>
</html>
