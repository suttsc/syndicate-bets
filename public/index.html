<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050706" />
    <title>Syndicate Bets · Live</title>
    <meta name="description" content="Live scores for Chris, Jamie, Paul and Steve's football bets." />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/app.css" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch {}
    </script>
    <script type="module" src="/js/theme.js"></script>
    <script type="module" src="/js/scores.js"></script>
  </head>
  <body>
    <div class="mx-auto max-w-3xl px-4 pt-[max(10.5px,env(safe-area-inset-top))] pb-tabbar">
      <header class="flex items-center justify-between">
        <div id="brand"></div>
        <div class="flex items-center gap-2">
          <button type="button" data-theme-toggle aria-label="Switch theme" class="glass grid h-10 w-20 place-items-center rounded-xs text-zinc-300 transition active:scale-90"></button>
          <button id="refresh" type="button" aria-label="Refresh scores" class="glass grid h-10 w-20 place-items-center rounded-xs text-zinc-300 transition active:scale-90">
            <svg id="refresh-icon" class="size-[12px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg>
          </button>
          <a href="/admin" aria-label="Admin" class="glass grid h-10 w-20 place-items-center rounded-xs text-zinc-300 transition active:scale-90">
            <svg class="size-[12px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
          </a>
        </div>
      </header>

      <!-- Round switcher -->
      <section id="round-head" class="mt-6 flex items-center justify-between gap-3">
        <div class="h-16 w-full animate-pulse rounded-xs bg-tint/5"></div>
      </section>

      <!-- Tally: sticky so it stays in view while scrolling cards -->
      <section id="summary" aria-live="polite" class="sticky top-0 z-10 -mx-4 mt-5 px-4 py-3 backdrop-blur-xl [mask-image:linear-gradient(to_bottom,black_85%,transparent)]">
        <div class="h-[79px] animate-pulse rounded-xs bg-tint/5"></div>
      </section>

      <main id="games" class="mt-1 grid gap-3 md:grid-cols-2">
        <div class="h-44 animate-pulse rounded-xs bg-tint/5"></div>
        <div class="h-44 animate-pulse rounded-xs bg-tint/5"></div>
      </main>

      <p id="updated" class="mt-8 text-center text-xs text-zinc-500">&nbsp;</p>
    </div>
  </body>
</html>
