<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <title>Bets · Admin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/js/admin.js"></script>
  </head>
  <body>
    <div class="mx-auto max-w-xl px-4 pt-[max(1rem,env(safe-area-inset-top))] pb-32">
      <header class="flex items-center gap-3">
        <a href="/" aria-label="Back to scores" class="grid size-11 place-items-center rounded-full bg-white shadow-sm ring-1 ring-slate-200 active:scale-95 dark:bg-slate-900 dark:ring-slate-800">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </a>
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight">Set the bets</h1>
          <p id="last-saved" class="text-sm text-slate-500 dark:text-slate-400">&nbsp;</p>
        </div>
      </header>

      <label class="mt-5 block rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Admin password</span>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Remembered on this device"
          class="mt-1.5 block h-12 w-full rounded-xl border-0 bg-slate-100 px-3 text-base ring-1 ring-transparent outline-none focus:ring-2 focus:ring-emerald-500 dark:bg-slate-800"
        />
      </label>

      <ol id="slots" class="mt-4 space-y-3"></ol>

      <button
        id="add-slot"
        type="button"
        class="mt-3 flex h-14 w-full items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 font-semibold text-slate-600 transition active:scale-[.99] dark:border-slate-700 dark:text-slate-300"
      >
        <span class="text-xl leading-none">+</span> Add a game
      </button>
    </div>

    <!-- Thumb-reachable save bar -->
    <div class="fixed inset-x-0 bottom-0 border-t border-slate-200 bg-white/90 px-4 pt-3 pb-[max(.75rem,env(safe-area-inset-bottom))] backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
      <div class="mx-auto flex max-w-xl items-center gap-3">
        <p id="save-status" role="status" class="min-w-0 flex-1 text-sm text-slate-500 dark:text-slate-400"></p>
        <button
          id="save"
          type="button"
          class="h-12 shrink-0 rounded-xl bg-emerald-600 px-5 font-bold text-white shadow-sm transition enabled:active:scale-95 disabled:opacity-40"
        >
          Save for everyone
        </button>
      </div>
    </div>
  </body>
</html>
