<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050706" />
    <title>Syndicate Bets · History</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Syndicate" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/app.css" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.style = localStorage.getItem('style') === 'terrace' ? 'terrace' : 'floodlight';
      } catch {}
    </script>
    <script type="module" src="/js/settings.js"></script>
    <script type="module" src="/js/history.js"></script>
  </head>
  <body>
    <div class="mx-auto max-w-3xl px-4 pt-[max(10.5px,env(safe-area-inset-top))] pb-tabbar">
      <header class="flex items-center justify-between">
        <div id="brand"></div>
      </header>
      <div class="mt-6">
        <h1 class="font-display text-4xl font-bold tracking-tight">History</h1>
        <p class="mt-1 text-sm text-zinc-400">Every round, newest first.</p>
      </div>
      <main id="content" class="mt-5 space-y-3">
        <div class="h-24 animate-pulse rounded-xs bg-tint/5"></div>
        <div class="h-24 animate-pulse rounded-xs bg-tint/5"></div>
        <div class="h-24 animate-pulse rounded-xs bg-tint/5"></div>
      </main>
    </div>
  </body>
</html>
