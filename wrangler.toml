# Cloudflare Worker: serves the static site in /public and the /api routes in src/server.
name = "syndicate-bets"
main = "src/server/index.js"
compatibility_date = "2025-09-01"

# Builds the Tailwind CSS before every `wrangler dev` / `wrangler deploy`.
[build]
command = "npm run build"

[assets]
directory = "public"
binding = "ASSETS"
# /history → history.html etc. Unknown paths (e.g. /round/12) fall back to index.html.
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
# Only API requests run the Worker; everything else is served straight from the asset cache.
run_worker_first = ["/api/*"]

# Lets the Worker import migrations/*.sql as text (used to create missing tables on first request).
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "syndicate-bets"
database_id = "5ad524d2-9281-4c31-82f0-c646e5f41257"
migrations_dir = "migrations"

[observability]
enabled = true
